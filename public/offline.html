<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Offline — imiles.me</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #0a0a0a;
        color: #e5e5e5;
        font-family: 'IBM Plex Mono', ui-monospace, monospace;
        -webkit-font-smoothing: antialiased;
      }
      .container {
        text-align: center;
        padding: 2rem;
        max-width: 28rem;
      }
      h1 {
        font-size: 1.5rem;
        font-weight: 600;
        margin-bottom: 1rem;
        color: #fafafa;
      }
      p {
        font-size: 0.875rem;
        line-height: 1.6;
        color: #a3a3a3;
        margin-bottom: 1.5rem;
      }
      button {
        border: 0;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 0.5rem 1.25rem;
        font-size: 0.875rem;
        font-weight: 500;
        color: #0a0a0a;
        background: #fafafa;
        border-radius: 0.5rem;
        cursor: pointer;
        font-family: inherit;
        transition: opacity 0.15s;
      }
      button:hover {
        opacity: 0.85;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>You're offline</h1>
      <p>
        It looks like you've lost your internet connection. Previously visited
        pages may still be available.
      </p>
      <button id="retry" type="button">Retry this page</button>
    </div>
    <script>
      const retry = () => window.location.reload();

      document.querySelector('#retry').addEventListener('click', retry);
      window.addEventListener('online', retry, { once: true });
    </script>
  </body>
</html>
