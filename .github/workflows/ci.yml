name: CI

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: 'true'
  NODE_OPTIONS: --max-old-space-size=4096

jobs:
  ci:
    name: 持续集成流水线
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v6
        with:
          version: 11.13.1

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 代码与格式检查
        run: |
          pnpm lint
          pnpm format:check

      - name: 全量类型与元数据检查
        run: |
          pnpm check
          pnpm check:server
          pnpm db:check

      - name: 运行测试套件
        run: |
          pnpm test:release
          pnpm test:boundaries
          pnpm test:server

      - name: 生产构建与边界校验
        run: |
          pnpm build
          test -s dist/_worker.js/index.js
          grep -qx '_worker.js' dist/.assetsignore
          test -s .astro/release-build.json
          test -s .astro/build-server-audit.json
          test -s .astro/build-client-audit.json
